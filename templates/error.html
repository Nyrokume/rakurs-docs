<!doctype html>
<html lang="ru">
<head>
<base href="{{base}}">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не открылась · Ясность</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="icon" href="assets/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="assets/apple-touch-180.png">
<script>(()=>{const t=localStorage.getItem('theme');document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')})()</script>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/site.css">
<style>
.sys{min-height:100dvh;display:grid;grid-template-rows:auto 1fr}
.sys-top{display:flex;align-items:center;height:var(--top);padding:0 20px;border-bottom:1px solid var(--border)}
.sys main{display:grid;place-items:center;padding:48px 20px}
.sys-box{max-width:480px;text-align:center}
.sys-frame{display:block;width:96px;height:96px;margin:0 auto 24px;color:var(--border-strong)}
.sys-frame .dot{fill:var(--primary);animation:sysd .9s var(--ease) both}
@keyframes sysd{from{transform:translate(-18px,10px);opacity:0}to{transform:none;opacity:1}}
.sys h1{font:600 32px/1.15 var(--font-head);letter-spacing:-.015em;margin:0 0 12px}
.sys p{color:var(--prose);margin:0 0 24px}
.sys-a{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.sys-frame .dot{animation:none}}
</style>
</head>
<body class="sys">
<header class="sys-top"><a class="brand" href="./"><img src="assets/mark.svg" alt="" width="26" height="26"><span class="brand-n">Ясность</span><span class="brand-s"><svg class="doc-ic" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M7 3h7l4 4v14H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M13 3v5h5M9 13h6M9 17h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>DOCS</span></a></header>
<main>
  <div class="sys-box">
    <svg class="sys-frame" viewBox="0 0 64 64" aria-hidden="true"><rect x="16" y="8" width="32" height="48" rx="6" fill="none" stroke="currentColor" stroke-width="2.4"/><rect x="23" y="18" width="18" height="4" rx="2" fill="currentColor"/><rect x="23" y="28" width="18" height="4" rx="2" fill="var(--primary)"/><rect class="dot" x="23" y="38" width="12" height="4" rx="2" fill="currentColor" opacity="0.4"/></svg>
    <h1>Страница не открылась</h1>
    <p>Перезагрузите её через минуту. Если не поможет, исходный текст всех страниц лежит <a href="https://github.com/Nyrokume/yasnost-docs/tree/main/content">в репозитории на GitHub</a>, в папке content.</p>
    <div class="sys-a"><button type="button" class="btn btn-primary" onclick="location.reload()">Перезагрузить</button><a class="btn btn-ghost" href="./">Открыть главную</a></div>
  </div>
</main>
</body>
</html>
