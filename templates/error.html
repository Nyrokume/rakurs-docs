<!doctype html>
<html lang="ru">
<head>
<base href="/rakurs-docs/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Ошибка · Ракурс</title>
<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<script>(()=>{const t=localStorage.getItem('theme');document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')})()</script>
<link rel="stylesheet" href="assets/site.css">
<style>
.sys{min-height:100dvh;display:grid;grid-template-rows:auto 1fr}
.sys-top{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.sys-top a{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:650}
.sys main{display:grid;place-items:center;padding:40px 20px}
.sys-box{max-width:520px;text-align:center}
.sys-frame{width:112px;height:112px;margin:0 auto 24px;color:var(--line-2)}
.sys-frame .dot{fill:var(--accent);animation:sysd 1.6s var(--ease) both}
@keyframes sysd{from{transform:translate(-18px,10px);opacity:0}to{transform:none;opacity:1}}
.sys h1{font-size:30px;margin-bottom:10px}
.sys p{color:var(--ink-2);margin:0 0 24px}
.sys-a{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:15px;cursor:pointer;text-decoration:none!important}
[data-theme=dark] .btn{color:#0b1a18}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line-2)}
.btn:active{transform:translateY(1px)}
@media (prefers-reduced-motion:reduce){.sys-frame .dot{animation:none}}
</style>
</head>
<body class="sys">
<header class="sys-top"><a href="./"><img src="assets/mark.svg" alt="" width="24" height="24">Ракурс</a></header>
<main>
  <div class="sys-box">
    <svg class="sys-frame" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 20V6h14"/><path d="M44 6h14v14"/><path d="M58 44v14H44"/><path d="M20 58H6V44"/></g><circle class="dot" cx="50" cy="16" r="5"/></svg>
    <h1>Страница не открылась.</h1>
    <p>Сбой на стороне хостинга или сети. Обычно хватает перезагрузки.</p>
    <div class="sys-a"><button class="btn" type="button" onclick="location.reload()">Перезагрузить</button><a class="btn ghost" href="./">К обзору</a></div>
  </div>
</main>
</body>
</html>
