<!doctype html>
<html lang="ru">
<head>
<base href="{{base}}">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не открылась · Ракурс</title>
<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<script>(()=>{const t=localStorage.getItem('theme');document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')})()</script>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/site.css">
<style>
.sys{min-height:100dvh;display:grid;grid-template-rows:auto 1fr}
.sys-top{display:flex;align-items:center;height:var(--top);padding:0 20px;border-bottom:1px solid var(--border)}
.sys main{display:grid;place-items:center;padding:48px 20px}
.sys-box{max-width:480px;text-align:center}
.sys-frame{display:block;width:96px;height:96px;margin:0 auto 24px;color:var(--border-strong)}
.sys-frame .dot{fill:var(--primary);animation:sysd .9s var(--ease) both}
@keyframes sysd{from{transform:translate(-18px,10px);opacity:0}to{transform:none;opacity:1}}
.sys h1{font:600 32px/1.15 var(--font-serif);letter-spacing:-.015em;margin:0 0 12px}
.sys p{color:var(--prose);margin:0 0 24px}
.sys-a{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.sys-frame .dot{animation:none}}
</style>
</head>
<body class="sys">
<header class="sys-top"><a class="brand" href="./"><img src="assets/mark.svg" alt="" width="26" height="26"><span class="brand-n">Ракурс</span><span class="brand-s">Документация</span></a></header>
<main>
  <div class="sys-box">
    <svg class="sys-frame" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 20V6h14"/><path d="M44 6h14v14"/><path d="M58 44v14H44"/><path d="M20 58H6V44"/></g><circle class="dot" cx="32" cy="32" r="5"/></svg>
    <h1>Страница не открылась</h1>
    <p>Перезагрузите её через минуту. Если не поможет, исходный текст всех страниц лежит <a href="https://github.com/Nyrokume/rakurs-docs/tree/main/content">в репозитории на GitHub</a>, в папке content.</p>
    <div class="sys-a"><button type="button" class="btn btn-primary" onclick="location.reload()">Перезагрузить</button><a class="btn btn-ghost" href="./">Открыть главную</a></div>
  </div>
</main>
</body>
</html>
